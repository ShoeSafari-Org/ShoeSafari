name: Firestore rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.firestore.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "lib/adminClaims.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-rules.yml"
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.firestore.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "lib/adminClaims.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firestore-rules.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --yes firebase-tools@13.35.1 --config firebase.firestore.json --project demo-shoesafari emulators:exec --only firestore "npx vitest run --config vitest.rules.config.js"
