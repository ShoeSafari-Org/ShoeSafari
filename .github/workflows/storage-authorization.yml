name: Storage authorization tests

on:
  pull_request:
    paths:
      - "storage.rules"
      - "firebase.storage.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-authorization.yml"
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "firebase.storage.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-authorization.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:rules:storage
