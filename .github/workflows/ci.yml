name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --run
      - run: npm run validate:production-env
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_CHECKOUT_CONTRACT_ID: C-CI_PLACEHOLDER
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: service-ci-placeholder
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: template-ci-placeholder
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: public-ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: firebase-ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: shoesafari-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: shoesafari-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: shoesafari-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:ci-placeholder
      - run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_CHECKOUT_CONTRACT_ID: C-CI_PLACEHOLDER
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: service-ci-placeholder
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: template-ci-placeholder
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: public-ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: firebase-ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: shoesafari-ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: shoesafari-ci
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: shoesafari-ci.appspot.com
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123:web:ci-placeholder

  interface:
    name: Checkout interface manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
      - run: npm run check:checkout-interface

  accessibility:
    name: Storefront accessibility checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e:accessibility

  contract:
    name: Soroban contract checks (Rust ${{ matrix.rust-toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-toolchain: [stable]
    defaults:
      run:
        working-directory: contracts/checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          targets: wasm32v1-none
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --target wasm32v1-none --release
